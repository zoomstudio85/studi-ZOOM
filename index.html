<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ستوديو زووم | Studio Zoom</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root { 
            --primary: #d4af37; 
            --dark: #2c3e50; 
            --accent: #e74c3c; 
            --wait: #f39c12;
            --bg: #f4f6f8;
        }

        body { 
            font-family: 'Cairo', sans-serif; margin: 0; padding: 0; 
            background: var(--bg); color: var(--dark); padding-bottom: 100px; 
        }
        
        /* Header */
        header { 
            background: #1e1e24; color: white; padding: 10px 20px; 
            position: sticky; top: 0; z-index: 1000; 
            display: flex; justify-content: space-between; align-items: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        .header-icons { display: flex; gap: 15px; align-items: center; }
        
        .merchant-login-btn { 
            border: 1px solid var(--primary); color: var(--primary); background: transparent; 
            padding: 5px 12px; border-radius: 20px; cursor: pointer; font-size: 0.8rem; 
            display: flex; align-items: center; gap: 5px; transition:0.3s;
        }
        .merchant-login-btn:hover { background: var(--primary); color: #000; }
        
        .merchant-badge { 
            background: var(--primary); color: black; padding: 5px 10px; 
            border-radius: 20px; font-weight: bold; font-size: 0.8rem; display: none; 
        }

        /* === العداد التنازلي الكبير (NEW) === */
        #countdown-section {
            background: linear-gradient(45deg, #1e1e24, #2c3e50);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 4px solid var(--primary);
            display: none; /* مخفي افتراضياً حتى يعمل الجافاسكربت */
        }
        .timer-title { font-size: 1.1rem; margin-bottom: 10px; color: var(--primary); font-weight: bold; }
        .timer-container {
            display: flex; justify-content: center; gap: 15px; direction: ltr; /* لتظبيط اتجاه الأرقام */
        }
        .time-box {
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 8px;
            min-width: 60px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .time-number { font-size: 1.5rem; font-weight: bold; display: block; line-height: 1; }
        .time-label { font-size: 0.7rem; opacity: 0.8; }

        /* Hero */
        .hero { 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://drive.google.com/uc?export=view&id=1B2cCSl5YOENoYaWiURnxttB1QTJ9hFLb'); 
            background-size: cover; color: white; text-align: center; 
            padding: 4rem 1rem; border-radius: 0 0 30px 30px; margin-bottom: 30px; 
        }
        
        /* Tabs */
        .tabs { 
            display: flex; overflow-x: auto; gap: 10px; justify-content: center; 
            margin-top: -50px; position: relative; z-index: 100; padding-bottom: 10px; 
        }
        .tab-btn { 
            background: white; border: none; padding: 10px 20px; border-radius: 50px; 
            cursor: pointer; font-weight: bold; font-family: 'Cairo'; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.3s; 
        }
        .tab-btn.active { background: var(--primary); color: white; transform: scale(1.05); }

        /* Grid */
        .container { max-width: 1200px; margin: auto; padding: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        
        .card { 
            background: white; border-radius: 15px; overflow: hidden; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); display: flex; flex-direction: column; 
            transition: 0.3s; position: relative; 
        }
        .card-img { height: 160px; width: 100%; object-fit: cover; }
        .card-body { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { font-weight: 700; font-size: 0.9rem; margin-bottom: 5px; }
        
        /* Badges */
        .stock-badge { 
            position: absolute; top: 10px; left: 10px; 
            background: rgba(0,0,0,0.7); color: white; padding: 2px 8px; 
            border-radius: 4px; font-size: 0.7rem; 
        }
        .waitlist-badge { 
            position: absolute; top: 10px; left: 10px; 
            background: var(--wait); color: white; padding: 4px 10px; 
            border-radius: 20px; font-size: 0.7rem; font-weight:bold; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); 
        }

        /* Buttons */
        .add-btn { 
            width: 100%; padding: 10px; background: var(--dark); color: white; 
            border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; 
            font-weight: bold; transition:0.3s; display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        .add-btn.waitlist-btn { background: var(--wait); color: white; }
        .add-btn.waitlist-btn:hover { background: #e67e22; }

        /* Sticky Cart Bar */
        .sticky-cart-bar { 
            position: fixed; bottom: 0; left: 0; width: 100%; 
            background: #1e1e24; color: white; padding: 15px 20px; display: none; 
            justify-content: space-between; align-items: center; 
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1); z-index: 1900; 
            border-top: 2px solid var(--primary); cursor: pointer; 
        }

        /* Modals */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; backdrop-filter: blur(5px); }
        .modal-content { background: white; width: 95%; max-width: 450px; margin: 20px auto; padding: 20px; border-radius: 15px; max-height: 90vh; overflow-y: auto; }

        .whatsapp-float { position: fixed; bottom: 85px; right: 20px; background: #25d366; color: white; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; z-index: 1500; text-decoration: none; }
    </style>
</head>
<body>

<header>
    <div class="logo"><h1 style="margin:0; font-size:1.2rem; color:var(--primary);">ستوديو زووم</h1></div>
    <div class="header-icons">
        <button class="merchant-login-btn" onclick="openLoginModal()" id="loginBtn"><i class="fas fa-user-lock"></i> دخول</button>
        <div class="merchant-badge" id="merchantBadge"><i class="fas fa-crown"></i> <span id="merchantNameDisplay"></span></div>
        <button class="merchant-login-btn" onclick="toggleLanguage()">EN</button>
        <div style="position:relative;" onclick="toggleCart()">
            <i class="fas fa-shopping-basket" style="font-size:1.4rem;"></i>
            <span class="cart-count" id="headerCartCount" style="position: absolute; top: -5px; right: -8px; background: var(--accent); color: white; border-radius: 50%; width: 16px; height: 16px; font-size: 0.65rem; display: flex; justify-content: center; align-items: center;">0</span>
        </div>
    </div>
</header>

<div id="countdown-section">
    <div class="timer-title" id="timer-title-display">🔥 عرض خاص ينتهي بعد:</div>
    <div class="timer-container">
        <div class="time-box"><span class="time-number" id="days">00</span><span class="time-label">يوم</span></div>
        <div class="time-box"><span class="time-number" id="hours">00</span><span class="time-label">ساعة</span></div>
        <div class="time-box"><span class="time-number" id="minutes">00</span><span class="time-label">دقيقة</span></div>
        <div class="time-box"><span class="time-number" id="seconds">00</span><span class="time-label">ثانية</span></div>
    </div>
</div>

<div class="hero">
    <h2 id="hero-text">أجمل اللحظات.. تستحق زووم</h2>
</div>

<div class="tabs">
    <button class="tab-btn active" onclick="filterProducts('all', this)" id="tab-all">الكل</button>
    <button class="tab-btn" onclick="filterProducts('ramadan', this)" id="tab-ramadan">🌙 رمضان</button>
    <button class="tab-btn" onclick="filterProducts('offers', this)" id="tab-offers">🔥 العروض</button>
    <button class="tab-btn" onclick="filterProducts('photos', this)" id="tab-photos">تصوير</button>
    <button class="tab-btn" onclick="filterProducts('wedding', this)" id="tab-wedding">زفاف</button>
    <button class="tab-btn" onclick="filterProducts('frames', this)" id="tab-frames">تابلوهات</button>
</div>

<div class="container">
    <div id="loader" style="text-align:center; padding:40px;"><i class="fas fa-spinner fa-spin fa-2x" style="color:var(--primary);"></i><br>جاري تحميل المنتجات...</div>
    <div class="grid" id="productContainer"></div>
</div>

<div class="sticky-cart-bar" id="stickyCartBar" onclick="toggleCart()">
    <div><span style="font-size:1.1rem; font-weight:bold; color:var(--primary);" id="stickyTotal">0 ج.م</span> <span style="font-size:0.8rem; color:#bbb;">(<span id="stickyCount">0</span>)</span></div>
    <button style="background:var(--primary); color:var(--dark); padding:8px 20px; border-radius:20px; border:none; font-weight:bold;">أكمل الطلب <i class="fas fa-chevron-left"></i></button>
</div>

<div class="modal" id="cartModal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eee; padding-bottom:15px;">
            <h3 style="margin:0">🛒 السلة</h3>
            <button onclick="toggleCart()" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">&times;</button>
        </div>
        <div id="cartItems" style="margin-top:15px;"></div>
        <div style="background:#f9f9f9; padding:15px; border-radius:10px; margin-top:20px;">
            <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:1.1rem; margin-bottom:15px;">
                <span>الإجمالي:</span><span style="color:var(--primary);"><span id="cartTotal">0</span> ج.م</span>
            </div>
            <input type="text" id="customerName" placeholder="الاسم" style="width:100%; padding:10px; margin:5px 0; border:1px solid #ddd; border-radius:5px;">
            <input type="tel" id="customerPhone" placeholder="رقم الهاتف" style="width:100%; padding:10px; margin:5px 0; border:1px solid #ddd; border-radius:5px;">
            <textarea id="orderNotes" rows="2" placeholder="ملاحظات..." style="width:100%; padding:10px; margin:5px 0; border:1px solid #ddd; border-radius:5px; resize:none;"></textarea>
        </div>
        <button class="checkout-btn" onclick="submitOrder()" style="background: #27ae60; color: white; width: 100%; padding: 12px; border: none; font-size: 1rem; cursor: pointer; margin-top: 15px; border-radius: 8px; font-weight: bold;">إرسال للواتساب <i class="fab fa-whatsapp"></i></button>
    </div>
</div>

<div class="modal" id="loginModal">
    <div class="modal-content" style="text-align:center;">
        <h3>🔐 دخول التجار</h3>
        <input type="tel" id="loginPhone" placeholder="رقم الهاتف (01xxxxxxxxx)" style="width:100%; padding:10px; margin:10px 0; border:1px solid #ddd; text-align:center;">
        <button onclick="verifyMerchant()" style="background:var(--primary); color:white; width:100%; padding:10px; border:none; border-radius:20px; margin-top:10px; cursor:pointer;">دخول</button>
        <button onclick="document.getElementById('loginModal').style.display='none'" style="background:transparent; color:#777; border:none; margin-top:10px; cursor:pointer;">إلغاء</button>
    </div>
</div>

<a href="https://wa.me/201006625152" class="whatsapp-float" target="_blank"><i class="fab fa-whatsapp"></i></a>

<script>
    // ****************************
    // ⚠️⚠️ ضع رابط السكربت الخاص بك هنا 
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyR8ZkyEJhld0q7-VJB1DYz7tkAWytf24pm8C8BBT1Qq5Hwk6-jq6AgO4G4tL9kLL8/exec";
    // ****************************

    // === ⏳ إعدادات العداد (التحكم من هنا) ===
    // 1. ضع تاريخ المناسبة (السنة، الشهر-1، اليوم)
    // ملحوظة: الشهور تبدأ من 0 (يناير=0, فبراير=1, ... رمضان القادم في فبراير 2026 تقريباً)
    const targetDate = new Date(2026, 1, 18).getTime(); // 18 فبراير 2026
    
    // 2. العنوان الذي يظهر فوق العداد
    const timerTitleText = "🌙 باقي على شهر رمضان الكريم:";
    
    // 3. هل تريد تشغيل العداد؟ (true=نعم / false=لا)
    const isTimerActive = true;
    // ==========================================

    const categoryImages = {
        'all': 'https://drive.google.com/uc?export=view&id=1B2cCSl5YOENoYaWiURnxttB1QTJ9hFLb',
        'ramadan': 'https://images.unsplash.com/photo-1617196037834-a129d555c425?auto=format&fit=crop&w=800&q=80',
        'offers': 'https://images.unsplash.com/photo-1512909006721-3d6018887383?auto=format&fit=crop&w=800&q=80',
        'photos': 'https://images.unsplash.com/photo-1516035069371-29a1b244cc32?auto=format&fit=crop&w=800&q=80',
        'wedding': 'https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=800&q=80',
        'frames': 'https://images.unsplash.com/photo-1513519245088-0e12902e5a38?auto=format&fit=crop&w=800&q=80'
    };

    let allProducts = [], authorizedClients = [], cart = [], currentLang = 'ar', currentUser = null;
    const translations = { ar: { add: "أضف للسلة", wait: "حجز (انتظار)", stock: "متبقي" }, en: { add: "Add to Cart", wait: "Waitlist Request", stock: "Left" } };

    // --- منطق العداد ---
    function startTimer() {
        if (!isTimerActive) return;
        document.getElementById('timer-title-display').innerText = timerTitleText;
        
        const timerInterval = setInterval(function() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                clearInterval(timerInterval);
                document.getElementById("countdown-section").innerHTML = "<h3 style='margin:0; padding:10px;'>✨ كل عام وأنتم بخير! ✨</h3>";
                document.getElementById("countdown-section").style.display = "block";
                return;
            }

            document.getElementById("countdown-section").style.display = "block";
            document.getElementById("days").innerText = Math.floor(distance / (1000 * 60 * 60 * 24));
            document.getElementById("hours").innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            document.getElementById("minutes").innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            document.getElementById("seconds").innerText = Math.floor((distance % (1000 * 60)) / 1000);
        }, 1000);
    }

    async function loadData() {
        document.getElementById('loader').style.display = 'block';
        try {
            const res = await fetch(SCRIPT_URL);
            const data = await res.json();
            allProducts = data.products || []; 
            authorizedClients = data.clients || [];
            renderProducts(allProducts);
            checkLocalStorage();
            startTimer(); // تشغيل العداد
        } catch (e) { 
            console.error(e);
            document.getElementById('productContainer').innerHTML = '<p style="text-align:center;width:100%;">تأكد من وضع الرابط الصحيح في الكود</p>';
        } finally { 
            document.getElementById('loader').style.display = 'none'; 
        }
    }

    function renderProducts(list) {
        const container = document.getElementById('productContainer');
        container.innerHTML = '';
        
        if (!list || list.length === 0) {
            container.innerHTML = '<p style="text-align:center; width:100%; padding:20px;">لا توجد منتجات حالياً</p>';
            return;
        }

        list.forEach(p => {
            let stockVal = 999;
            if (p.stock !== undefined && p.stock !== "" && p.stock !== null) {
                stockVal = parseInt(p.stock);
            }
            
            const isWaitlist = stockVal <= 0;
            const btnText = isWaitlist ? translations[currentLang].wait : translations[currentLang].add;
            const btnClass = isWaitlist ? 'add-btn waitlist-btn' : 'add-btn';
            
            // التفاصيل (الوصف)
            const detailsText = p.details ? `<p style="font-size:0.8rem; color:#777; margin:5px 0;">${p.details}</p>` : '';

            let badge = '';
            if (isWaitlist) {
                badge = `<div class="waitlist-badge">⏳ قائمة انتظار</div>`;
            } else if (stockVal < 999) {
                badge = `<div class="stock-badge">${translations[currentLang].stock}: ${stockVal}</div>`;
            }

            container.innerHTML += `
                <div class="card">
                    ${badge}
                    <img src="${processImage(p.image)}" class="card-img" loading="lazy">
                    <div class="card-body">
                        <div>
                            <div class="card-title">${p.name}</div>
                            ${detailsText}
                            <div class="card-price">${p.price} ج.م</div>
                        </div>
                        <button class="${btnClass}" onclick="addToCart('${p.id}')">
                            <i class="${isWaitlist ? 'fas fa-clock' : 'fas fa-cart-plus'}"></i> ${btnText}
                        </button>
                    </div>
                </div>`;
        });
    }

    function addToCart(id) {
        const p = allProducts.find(x => x.id == id);
        if(!p) return;

        let stock = 999;
        if (p.stock !== undefined && p.stock !== "" && p.stock !== null) {
            stock = parseInt(p.stock);
        }
        
        const isWaitlist = stock <= 0;
        const exist = cart.find(x => x.id == id);
        
        if (!isWaitlist && exist && exist.qty + 1 > stock) {
            alert("عذراً، لا يوجد مخزون كافٍ!");
            return;
        }
        
        if (exist) {
            exist.qty++;
        } else {
            cart.push({...p, qty: 1, isWaitlist: isWaitlist});
        }
        
        updateCartUI();
        
        const btn = event.target.closest('button');
        if(btn) {
            const original = btn.innerHTML;
            btn.innerHTML = isWaitlist ? 'تم الحجز' : '<i class="fas fa-check"></i>';
            setTimeout(() => btn.innerHTML = original, 800);
        }
    }

    function updateCartUI() {
        const totalQty = cart.reduce((a, b) => a + b.qty, 0);
        let totalMoney = cart.reduce((a, b) => a + (b.price * b.qty), 0);
        
        document.getElementById('headerCartCount').innerText = totalQty;
        
        const stickyBar = document.getElementById('stickyCartBar');
        if (totalQty > 0) {
            stickyBar.style.display = 'flex';
            document.getElementById('stickyCount').innerText = totalQty;
            document.getElementById('stickyTotal').innerText = totalMoney + ' ج.م';
        } else { stickyBar.style.display = 'none'; }
        
        document.getElementById('cartTotal').innerText = totalMoney;
        const container = document.getElementById('cartItems');
        container.innerHTML = '';
        
        cart.forEach((item, idx) => {
            const waitlistTag = item.isWaitlist ? '<span style="color:#f39c12; font-size:0.8rem;">(انتظار)</span>' : '';
            
            container.innerHTML += `
                <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eee; padding:10px 0;">
                    <div>
                        <b>${item.name}</b> ${waitlistTag}<br>
                        <small>(${item.price} ج.م)</small>
                    </div>
                    <div style="display:flex; gap:5px; align-items:center;">
                        <button onclick="changeQty(${idx}, -1)" style="width:25px;height:25px;border-radius:50%;border:1px solid #ccc;">-</button>
                        <span>${item.qty}</span>
                        <button onclick="changeQty(${idx}, 1)" style="width:25px;height:25px;border-radius:50%;background:var(--primary);color:white;border:none;">+</button>
                    </div>
                </div>`;
        });
    }

    function changeQty(idx, delta) {
        const item = cart[idx];
        const p = allProducts.find(x => x.id == item.id);
        
        let stock = 999;
        if (p.stock !== undefined && p.stock !== "" && p.stock !== null) {
            stock = parseInt(p.stock);
        }
        
        if (delta > 0 && !item.isWaitlist && item.qty + 1 > stock) {
            alert("لا يوجد مخزون كافٍ!");
            return;
        }
        
        if (item.qty + delta > 0) item.qty += delta; else cart.splice(idx, 1);
        updateCartUI();
    }

    function submitOrder() {
        const name = document.getElementById('customerName').value;
        const phone = document.getElementById('customerPhone').value;
        const notes = document.getElementById('orderNotes').value;
        if (cart.length === 0) return alert('السلة فارغة');
        if (!name || !phone) return alert('أكمل البيانات');

        const btn = document.querySelector('.checkout-btn');
        btn.innerHTML = 'جاري الإرسال...';
        btn.disabled = true;

        const items = cart.map(i => {
            const status = i.isWaitlist ? " [⏳ انتظار]" : "";
            return `▪️ ${i.name} (${i.qty})${status}`;
        }).join('%0a');
        
        const total = document.getElementById('cartTotal').innerText;
        const itemsJson = JSON.stringify(cart.map(i => ({ rowIndex: i.rowIndex, qty: i.qty })));

        let msg = `*طلب جديد:*%0a👤 ${name}%0a📱 ${phone}%0a------------------%0a${items}%0a------------------%0a💰 الإجمالي: ${total} ج.م`;
        if(notes) msg += `%0a📝 ${notes}`;
        msg += `%0a📷 أرسل الصور...`;

        window.open(`https://wa.me/201006625152?text=${msg}`, '_blank');
        
        const fd = new FormData();
        fd.append('date', new Date().toLocaleString());
        fd.append('name', name); fd.append('phone', phone);
        fd.append('order', cart.map(i => `${i.name} x${i.qty} ${i.isWaitlist?'(انتظار)':''}`).join(' + '));
        fd.append('total', total); fd.append('notes', notes);
        fd.append('itemsJson', itemsJson);

        fetch(SCRIPT_URL, {method:'POST', body:fd})
        .then(() => {
            cart = []; updateCartUI(); toggleCart();
            setTimeout(loadData, 1000); 
        })
        .finally(() => {
            btn.innerHTML = 'إرسال للواتساب';
            btn.disabled = false;
        });
    }

    function processImage(url) { if (!url) return 'https://via.placeholder.com/150'; if (url.includes('drive.google.com')) { const match = url.match(/[-\w]{25,}/); return match ? `https://drive.google.com/uc?export=view&id=${match[0]}` : url; } return url; }
    function filterProducts(cat, btn) { document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); if(btn) btn.classList.add('active'); const hero = document.querySelector('.hero'); if(categoryImages[cat]) hero.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('${categoryImages[cat]}')`; renderProducts(cat === 'all' ? allProducts : allProducts.filter(p => p.category === cat)); }
    function toggleCart() { const m = document.getElementById('cartModal'); m.style.display = m.style.display === 'block' ? 'none' : 'block'; }
    function openLoginModal() { document.getElementById('loginModal').style.display = 'block'; }
    function verifyMerchant() { const inputPhone = document.getElementById('loginPhone').value.trim(); const client = authorizedClients.find(c => c.phone === inputPhone); if (client) { currentUser = client; localStorage.setItem('zoom_merchant', JSON.stringify(client)); applyLoginState(); document.getElementById('loginModal').style.display = 'none'; alert(`أهلاً بك يا ${client.name}!`); } else { alert("رقم غير مسجل"); } }
    function checkLocalStorage() { const saved = localStorage.getItem('zoom_merchant'); if (saved) { currentUser = JSON.parse(saved); applyLoginState(); } }
    function applyLoginState() { if (currentUser) { document.getElementById('loginBtn').style.display = 'none'; document.getElementById('merchantBadge').style.display = 'block'; document.getElementById('merchantNameDisplay').innerText = currentUser.name; document.getElementById('customerName').value = currentUser.name; document.getElementById('customerPhone').value = currentUser.phone; document.getElementById('hero-text').innerText = `مرحباً شريك النجاح: ${currentUser.name}`; } }
    function toggleLanguage() { currentLang = currentLang === 'ar' ? 'en' : 'ar'; document.querySelector('html').dir = currentLang === 'ar' ? 'rtl' : 'ltr'; renderProducts(allProducts); }

    loadData();
</script>

</body>
